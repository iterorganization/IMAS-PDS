# Per-pulse copy of workflows/evolutive_controller/waveforms.yaml for 105033, made by bin/pds-tendencies: only the
# EC power entries (pulse data, see below) differ from the generic file. Regenerate
# with the command recorded next to them.
# Waveform-Editor configuration for evolutive_controller's F_INIT bootstrap.
# `eq` (the one-shot `source` actor) is a NICE-reconstructed equilibrium, not raw DINA -- see
# workflow.ymmsl's header comment for why TORAX's geometry builder needs that. `reconstruction:`
# below passes it through whole (every field, not just the hand-picked ones); `state:`/
# `targets:` then overlay specific fields on top, same as inverse_convergence. `cp` (previously
# a Picard-loop port there) is just this scenario's own DINA data here, so referenced directly
# via `input` instead of a port.
globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${SCENARIOS_REPO}/${SHOT}/data/in"
    input_md: "imas:hdf5?path=${SCENARIOS_REPO}/${SHOT}/data/in_md"
    eq: {port: equilibrium_in}

# Static machine-description reference
machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

reconstruction:
  equilibrium/*:
    - {ref: eq}

# Needed to kick-start NICE and TORAX
state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: input}
  core_profiles/profiles_1d/time:
    - {ref: input}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: input}
  core_profiles/profiles_1d/grid/psi:
    - {ref: input}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: input}
  core_profiles/profiles_1d/electrons/density:
    - {ref: input}
  core_profiles/profiles_1d/t_i_average:
    - {ref: input}
  core_profiles/profiles_1d/conductivity_parallel:
    - {ref: input}
  core_profiles/profiles_1d/j_non_inductive:
    - {ref: input}

targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {ref: input}
  equilibrium/vacuum_toroidal_field/b0:
    - {ref: input}
  core_profiles/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/z:
    - {ref: input}
  # EC heating power: piecewise-linear tendency of DINA's
  # summary/heating_current_drive/power_additional (the only additional power
  # DINA fills: power_ec=0, power_nbi=0, power_ic=0, power_lh=0 points), 6 knots, max deviation
  # 0.006 MW (tolerance 0.1 MW) over 391 samples, peak 1 MW.
  # GENERATED by bin/pds-tendencies on 2026-10-15: pds-tendencies 105033 --write cases/pulses/files/evolutive_controller_105033_waveforms.yaml
  # source: imas:hdf5?path=/work/imas/shared/imasdb/ITER/3/105033/1 (DD 3.38.1)
  # TORAX (actor power_only_sources, see pds/tendencies.py) reads the power into
  # sources.ecrh.P_total and computes the deposition, ohmic heating and radiation
  # itself; the index tendency needs an explicit interval spanning the pulse.
  core_sources/source(1)/identifier/name:
    - {value: ec}
  core_sources/source(1)/identifier/index:
    - {value: 3, start: 0, end: 150}
  core_sources/source(1)/global_quantities/power:
    - {time: [0, 1.1, 1.2, 1.3, 1.73, 141.26], value: [0, 0, 1.0e6, 1.0e6, 0, 0]}
  pf_active/coil(*)/current/data:
    - {ref: input}
  pf_active/coil(*)/voltage/data:
    - {ref: input}
