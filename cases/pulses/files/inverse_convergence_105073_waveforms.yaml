globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${SCENARIOS_REPO}/${SHOT}/data/in"
    input_md: "imas:hdf5?path=${SCENARIOS_REPO}/${SHOT}/data/in"
    eq: {port: equilibrium_in}
    cp: {port: core_profiles_in}

machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: cp}
  core_profiles/profiles_1d/time:
    - {ref: cp}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: cp}
  core_profiles/profiles_1d/grid/psi:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/density:
    - {ref: cp}
  core_profiles/profiles_1d/t_i_average:
    - {ref: cp}

targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {ref: input}
  equilibrium/vacuum_toroidal_field/b0:
    - {ref: input}
  core_profiles/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/z:
    - {ref: input}
  # EC heating power: piecewise-linear tendency of DINA's
  # summary/heating_current_drive/power_additional (the only additional power
  # DINA fills: power_ec=0, power_nbi=0, power_ic=0, power_lh=0 points), 10 knots, max deviation
  # 0.013 MW (tolerance 0.1 MW) over 39896 samples, peak 40 MW.
  # GENERATED by bin/pds-tendencies on 2026-10-15: pds-tendencies 105073 --write cases/pulses/files/inverse_convergence_105073_waveforms.yaml
  # source: imas:mdsplus?path=/work/projects/dina/imasdb/iter/3/105073/6 (DD 3.39.0)
  # TORAX (actor power_only_sources, see pds/tendencies.py) reads the power into
  # sources.ecrh.P_total and computes the deposition, ohmic heating and radiation
  # itself; the index tendency needs an explicit interval spanning the pulse.
  core_sources/source(1)/identifier/name:
    - {value: ec}
  core_sources/source(1)/identifier/index:
    - {value: 3, start: 0, end: 280}
  core_sources/source(1)/global_quantities/power:
    - {time: [0, 4, 8, 10, 14.01, 69, 81.01, 147.52, 208.53, 270.59], value: [0, 0, 1.999e6, 2.333e6, 9.004e6, 40.0e6, 40.0e6, 40.0e6, 0, 0]}
  pf_active/coil(*)/current/data:
    - {ref: input}
