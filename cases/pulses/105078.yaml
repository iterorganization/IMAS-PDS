# Pulse file for 105078 -- see cases/pulses/TEMPLATE.yaml for every key.
# Regenerate the derived files with: bin/pds-configure cases/pulses/105078.yaml
shot: 105078
description: "DINA shot 105078; source: DINA project database /work/projects/dina/imasdb (MDSplus), not the official ITER store"

# Preparation only: this shot has no tuned workflow configuration (its former
# cases/overrides/*.ymmsl were empty, i.e. the generic settings). The METIS workflows
# are deliberately not listed: listing them would write source_metis.t_min/t_max =
# time.t_start/t_end, cutting METIS's own input range (metis_in spans the whole DINA
# pulse). bin/pds-create-case <workflow> 105078 uses the generic settings only.
workflows: []

prepare:
  source: imas:mdsplus?path=/work/projects/dina/imasdb/iter/3/105078/6
  # The stored data (pds-scenarios) were prepared with the "legacy" set (ITER_MD
  # 111001/203, 115005/2, 116000/4); "basic" = the active ITER_MD versions.
  machine_description: basic
  n_timeslices: 41
  md_layout: separate
  dd_version: "4.0.0"

time:
  # Stored slice range 2.52 .. 282.82 s, rounded outward to 0.1 s.
  # Used by the overrides generated from this file (none while workflows is empty).
  t_start: 2.5
  t_end: 282.9

# EC heating (added 2026-10-15): cases/pulses/files/inverse_convergence_105078_waveforms.yaml
# holds the EC power tendency fitted to DINA's summary power_additional by
# bin/pds-tendencies, ready for an inverse_convergence case; with `workflows: []` it is
# not referenced here (a settings: entry needs its workflow listed above). To run
# inverse_convergence, add it to workflows: and
#   settings: {inverse_convergence: {waveform_editor.waveforms: ${PDS_REPO}/cases/pulses/files/inverse_convergence_105078_waveforms.yaml}}

postprocess:
  t_list: [20, 150, 270]
