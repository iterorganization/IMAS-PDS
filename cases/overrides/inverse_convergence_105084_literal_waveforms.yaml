# Scenario 105084, LITERAL pulse design -- a complete alternative to waveforms.yaml.
#
# Same shot, same dataset. Where waveforms.yaml takes r0/b0/Ip/psi_boundary and the coil
# currents from the input IDS ({ref: input}), this states them as explicit tendencies, so
# the pulse design is readable in the file rather than implied by a trace.
#
# The boundary outline stays {ref: input}: it is a variable-length per-slice spatial array
# and the tendency system produces one scalar per time step, so an import is the only way
# to populate it. Same for core_sources.

globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${SCENARIOS_REPO}/105084/data/in"
    input_md: "imas:hdf5?path=${SCENARIOS_REPO}/105084/data/in_md"
    eq: {port: equilibrium_in}
    cp: {port: core_profiles_in}

# Static machine-description reference
machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

# Needed to kick-start NICE and TORAX
state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: cp}
  core_profiles/profiles_1d/time:
    - {ref: cp}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: cp}
  core_profiles/profiles_1d/grid/psi:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/density:
    - {ref: cp}
  core_profiles/profiles_1d/t_i_average:
    - {ref: cp}

# Targets for workflow. Main values to tweak
targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {value: 6.2}
  equilibrium/vacuum_toroidal_field/b0:
    - {value: -2.65}
  equilibrium/time_slice/global_quantities/ip:
    - {time: [0, 2.42, 16.5, 256.4, 280.35], value: [0, -1.266e6, -3.5e6, -3.5e6, -1.04e6]}
  core_profiles/global_quantities/ip:
    - {time: [0, 2.42, 16.5, 256.4, 280.35], value: [0, -1.266e6, -3.5e6, -3.5e6, -1.04e6]}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {time: [2.42, 9.52, 16.5, 44.72, 72.9, 108.22, 143.5, 178.72, 214.0, 256.4, 266.2, 280.35], value: [-104.64, -94.14, -88.18, -78.97, -72.44, -64.89, -57.36, -49.92, -42.40, -33.40, -32.77, -38.36]}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/z:
