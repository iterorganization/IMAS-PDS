      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-32453, -36492, -36788, -31730, -23271, -18155, -4607] }
    pf_active/coil(7)/current/data:   # Poloidal Field Coil 1 (PF1)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-21769, -23002, -14642, -10555, -8924, -7553, -15270] }
    pf_active/coil(8)/current/data:   # Poloidal Field Coil 2 (PF2)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-5714, -1854, -9449, -6862, -3694, -2533, 4546] }
    pf_active/coil(9)/current/data:   # Poloidal Field Coil 3 (PF3)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [651, 5082, 9812, 8950, 8390, 8010, 602] }
    pf_active/coil(10)/current/data:  # Poloidal Field Coil 4 (PF4)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-1015, 3476, 5615, 7523, 8456, 9231, 716] }
    pf_active/coil(11)/current/data:  # Poloidal Field Coil 5 (PF5)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [896, 7957, -104, -2234, -1748, -1643, 7266] }
    pf_active/coil(12)/current/data:  # Poloidal Field Coil 6 (PF6)
