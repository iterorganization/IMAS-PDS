    pf_active/coil(3)/current/data:   # Central Solenoid 1U (CS1U)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-32894, -21170, -13679, -8023, -3125, -415, -10428] }
    pf_active/coil(4)/current/data:   # Central Solenoid 1L (CS1L)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-32894, -21170, -13679, -8023, -3125, -415, -10428] }
    pf_active/coil(5)/current/data:   # Central Solenoid 2L (CS2L)
      - { time: [2.42, 16.5, 72.9, 143.5, 214.0, 256.4, 280.35], value: [-34884, -28171, -23687, -19075, -14646, -12078, -17030] }
