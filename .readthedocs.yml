version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      # setuptools_scm derives the version from tags, and docs/source/conf.py
      # reads pds.__version__ -- a shallow clone has no tags, so the import fails.
      - git fetch --unshallow || true
      - git fetch --tags || true
    # pip ignores [tool.uv] override-dependencies in pyproject.toml, so the docs extra
    # (ymmsl2svg -> ymmsl 0.18 vs muscle3 0.10 -> ymmsl<0.18) only resolves with uv.
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --extra docs

# HTML only; no PDF or ePub builds.
formats: []

sphinx:
  builder: html
  configuration: docs/source/conf.py
  # Read the Docs does not use docs/Makefile -- it invokes sphinx-build itself, so the
  # Makefile's `-W` never applies here. Set it explicitly, or RTD will publish a build
  # that GitHub CI would have rejected.
  fail_on_warning: true

