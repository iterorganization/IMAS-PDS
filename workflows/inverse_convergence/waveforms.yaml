# Waveform-Editor configuration for the inverse_convergence loop (scenario 105084). Each
# Picard iteration the loop sends the waveform actor its two live F_INIT ports -- the target
# equilibrium and the (TORAX-evolved) core_profiles -- and the actor exports on the
# equilibrium's /time (the first-declared F_INIT port in workflow.ymmsl, so it is the export
# time base): the equilibrium with the designed Ip(t)/B0 overlaid (the NICE-inverse target),
# core_profiles mirrored straight through (resampled onto the equilibrium time base) on to
# TORAX, a core_sources IDS with the designed ECRH heating for TORAX, and the static
# machine-description IDSs (wall, pf_passive, iron_core) plus the coil-current seed
# (pf_active) NICE needs -- none of these four ever change across the pulse or across
# iterations (the coil-current seed is never fed back from NICE's own result), so `we` just
# re-exports the scenario's reference copy straight through to the NICE load balancer.
#
# `input` names the scenario's DINA-derived static reference IDS (the designed heating
# plus Ip/B0/boundary); `input_md` names the machine-description reference IDS (wall,
# pf_passive, iron_core, pf_active) written separately during preprocessing; `eq` and
# `cp` are the two live port-imports above. Edit the analytic Ip/B0 below to redesign
# the pulse.
globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${SCEN}/tmp/data/${SHOT}_in_we"
    input_md: "imas:hdf5?path=${SCEN}/tmp/data/${SHOT}_in_md_we"
    eq: {port: equilibrium_in}
    cp: {port: core_profiles_in}

# Static machine-description reference (see input_md above): wall, pf_passive,
# iron_core, and the pf_active coil-current seed NICE needs.
machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: cp}
  core_profiles/profiles_1d/time:
    - {ref: cp}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: cp}
  core_profiles/profiles_1d/grid/psi:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/density:
    - {ref: cp}
  core_profiles/profiles_1d/t_i_average:
    - {ref: cp}

targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {ref: input}
  equilibrium/vacuum_toroidal_field/b0:
    - {ref: input}
  core_profiles/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/z:
    - {ref: input}
  core_sources/*:
    - {ref: input}
  core_sources/source(1)/identifier/name:
    - {value: ec}
  pf_active/coil(*)/current/data:
    - {ref: input}

