# Waveform-Editor configuration for inverse_convergence. Full pulse design: equilibrium +
# core_profiles. Generic across scenarios -- ${SCENARIOS_REPO}/${SHOT} is filled in by
# pds-create-case. Scenarios using MD_LAYOUT=combined (no separate data/in_md) need a
# variant with input_md pointing at data/in instead -- see
# cases/pulses/files/inverse_convergence_105073_waveforms.yaml.
# The EC power is pulse data: every pulse gets a copy of this file with its own EC
# tendency, written by bin/pds-tendencies (see the core_sources entries below).

globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${SCENARIOS_REPO}/${SHOT}/data/in"
    input_md: "imas:hdf5?path=${SCENARIOS_REPO}/${SHOT}/data/in_md"
    eq: {port: equilibrium_in}
    cp: {port: core_profiles_in}

machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: cp}
  core_profiles/profiles_1d/time:
    - {ref: cp}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: cp}
  core_profiles/profiles_1d/grid/psi:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: cp}
  core_profiles/profiles_1d/electrons/density:
    - {ref: cp}
  core_profiles/profiles_1d/t_i_average:
    - {ref: cp}

targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {ref: input}
  equilibrium/vacuum_toroidal_field/b0:
    - {ref: input}
  core_profiles/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/z:
    - {ref: input}
  # EC heating: pulse data. The per-pulse waveform file written by bin/pds-tendencies
  # (cases/pulses/files/<wf>_<case>_waveforms.yaml, a copy of this file referenced from
  # the pulse file through settings.<wf>.waveform_editor.waveforms) carries only the EC
  # power, as a piecewise-linear tendency of DINA's summary
  # heating_current_drive/power_additional; the TORAX actor reads it into
  # sources.ecrh.P_total and TORAX computes the deposition, the ohmic heating and the
  # radiation itself (config_torax.py). This generic file only declares the source with
  # a 0 W placeholder: a case built without a per-pulse file runs WITHOUT EC heating.
  # DINA's own core_sources is not imported: its source(1) is the "total" source
  # (additional + ohmic - radiation) and would double-count TORAX's own models.
  core_sources/source(1)/identifier/name:
    - {value: ec}
  core_sources/source(1)/identifier/index:
    - {value: 3, start: 0, end: 1000}
  core_sources/source(1)/global_quantities/power:
    - {value: 0, start: 0, end: 1000}
  pf_active/coil(*)/current/data:
    - {ref: input}
