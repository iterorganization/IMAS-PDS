# Waveform-Editor configuration for the inverse_convergence loop (scenario 105084). Each
# Picard iteration the loop sends the waveform actor the target equilibrium; the actor reads
# its /time and returns: the equilibrium with the designed Ip(t)/B0 overlaid (the NICE-inverse
# target), and a core_sources IDS with the designed ECRH heating for TORAX.
#
# `references` names the scenario input IDS; `reference` tendencies read designed quantities
# from it (resampled onto /time). Edit the analytic Ip/B0 below to redesign the pulse.
references:
  # ${SCEN} (this scenario dir) is expanded by bin/pds-inverse before the `we` actor reads
  # this file; it resolves to the preprocessed input, same as loop.source_uri.
  input: "imas:hdf5?path=${SCEN}/tmp/data/${SHOT}_in_we"
globals:
  dd_version: 4.0.0

Plasma current:
  equilibrium/time_slice/global_quantities/ip:
    - {ref: input}

# Vacuum toroidal field B0 at R0=6.2 m, flat at -2.65 T (R0 is static, read from the input).
Toroidal field:
  equilibrium/vacuum_toroidal_field/b0:
    - {type: constant, value: -2.65}

# ECRH heating: import the DINA electron-heating profiles from the scenario input (the `*`
# pulls every filled leaf under profiles_1d, resampled onto /time) and name the source 'ec'
# so TORAX's sources_from_IMAS maps it. The waveform editor emits this core_sources to TORAX.
Heating:
  core_sources/source(1)/profiles_1d/*:
    - {ref: input}
  core_sources/source(1)/identifier/name:
    - {value: ec}
