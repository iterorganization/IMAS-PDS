# Waveform-Editor configuration for evolutive_controller's F_INIT bootstrap, seeded from a
# completed inverse_convergence run of the same shot wherever it has the data:
# - `eq` (the one-shot `source` actor) is that run's NICE-reconstructed equilibrium, passed
#   through whole -- TORAX's geometry builder needs its flux-surface quantities.
# - `torax` is that run's converged TORAX core_profiles (copied in by preprocess.sh). All
#   core_profiles fields come from it so they share one radial grid; it has no
#   j_non_inductive, so NICE evo_rd falls back to j_bootstrap, same as on every later step.
# - `nice` is that run's NICE coil currents.
# The EC power (DINA's, as summary.heating_current_drive.power_ec) and coil voltages stay on
# DINA `input`: inverse_convergence never writes either to disk.
globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${CASE_DIR}/preprocess/in"
    input_md: "imas:hdf5?path=${CASE_DIR}/preprocess/in_md"
    eq: {port: equilibrium_in}
    nice: "imas:hdf5?path=${PDS_REPO}/cases/runs/inverse_convergence_${SHOT}/out_nice"
    torax: "imas:hdf5?path=${CASE_DIR}/preprocess/inverse_convergence_${SHOT}_core_profiles"

# Static machine-description reference
machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

reconstruction:
  equilibrium/*:
    - {ref: eq}

# Needed to kick-start NICE and TORAX
state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: torax}
  core_profiles/profiles_1d/time:
    - {ref: torax}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: torax}
  core_profiles/profiles_1d/grid/psi:
    - {ref: torax}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: torax}
  core_profiles/profiles_1d/electrons/density:
    - {ref: torax}
  core_profiles/profiles_1d/t_i_average:
    - {ref: torax}
  core_profiles/profiles_1d/pressure_thermal:
    - {ref: torax}
  core_profiles/profiles_1d/conductivity_parallel:
    - {ref: torax}
  core_profiles/profiles_1d/j_bootstrap:
    - {ref: torax}

targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {ref: eq}
  equilibrium/vacuum_toroidal_field/b0:
    - {ref: eq}
  core_profiles/global_quantities/ip:
    - {ref: torax}
  equilibrium/time_slice/global_quantities/ip:
    - {ref: eq}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: eq}
  equilibrium/time_slice/boundary/outline/z:
    - {ref: eq}
  core_sources/source(1)/identifier/name:
    - {value: ec}
  core_sources/source(1)/global_quantities/power:
    - {ref: input, path: summary/heating_current_drive/power_ec/value, interp: linear}
  pf_active/coil(*)/current/data:
    - {ref: nice}
  pf_active/coil(*)/voltage/data:
    - {ref: input}
