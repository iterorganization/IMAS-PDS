# Waveform-Editor configuration for torax_nice_self_rd_controller's F_INIT bootstrap.
# `eq` (the one-shot `source` actor) is a NICE-reconstructed equilibrium, not raw DINA -- see
# workflow.ymmsl's header comment for why TORAX's geometry builder needs that. `reconstruction:`
# below passes it through whole (every field, not just the hand-picked ones); `state:`/
# `targets:` then overlay specific fields on top, same as inverse_convergence. `cp` (previously
# a Picard-loop port there) is just this scenario's own DINA data here, so referenced directly
# via `input` instead of a port.
globals:
  dd_version: 4.0.0
  imports:
    input: "imas:hdf5?path=${SCEN}/tmp/data/${SHOT}_in_waveform_editor"
    input_md: "imas:hdf5?path=${SCEN}/tmp/data/${SHOT}_in_md_waveform_editor"
    eq: {port: equilibrium_in}

# Static machine-description reference
machine_description:
  wall/*:
    - {ref: input_md}
  pf_passive/*:
    - {ref: input_md}
  iron_core/*:
    - {ref: input_md}
  pf_active/*:
    - {ref: input_md}

# Passthrough of the full received (NICE-reconstructed) equilibrium -- a broad/structural
# import, applied before the more specific state/targets overrides below (r_inboard/r_outboard/
# gm1-9/dvolume_dpsi/j_phi/etc. are not touched by anything else in this file and pass straight
# through, which is what TORAX's geometry builder needs).
reconstruction:
  equilibrium/*:
    - {ref: eq}

# Needed to kick-start NICE and TORAX
state:
  equilibrium/time_slice/profiles_1d/psi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/f_df_dpsi:
    - {ref: eq}
  equilibrium/time_slice/profiles_1d/dpressure_dpsi:
    - {ref: eq}
  core_profiles/global_quantities/v_loop:
    - {ref: input}
  core_profiles/profiles_1d/time:
    - {ref: input}
  core_profiles/profiles_1d/grid/rho_tor_norm:
    - {ref: input}
  core_profiles/profiles_1d/grid/psi:
    - {ref: input}
  core_profiles/profiles_1d/electrons/temperature:
    - {ref: input}
  core_profiles/profiles_1d/electrons/density:
    - {ref: input}
  core_profiles/profiles_1d/t_i_average:
    - {ref: input}
  # nice_evo_rd's RD bootstrap dereferences conductivity_parallel(i) with no bounds/size check
  # (nice_imas.cc:9277) -- an empty array here segfaults it. j_non_inductive IS guarded there
  # (falls back to j_bootstrap, then 0.0) but include it too since DINA has it and it's the
  # non-inductive current NICE's RD solve needs, per the same unguarded loop.
  core_profiles/profiles_1d/conductivity_parallel:
    - {ref: input}
  core_profiles/profiles_1d/j_non_inductive:
    - {ref: input}

# Targets: pass the DINA trace through as-is (no designed-pulse overlay -- the magnetic
# controller and self-consistent transport determine Ip/coil currents/heating going forward,
# this is only the F_INIT snapshot). core_sources/source(1) is relabeled 'ec' so TORAX's
# sources_from_IMAS() recognizes it as the ECRH actuator; DINA's other 14 source entries have
# no identifier.name at all, so sources_from_IMAS() skips them -- see the caveat this resolves
# in config_torax.py.
targets:
  equilibrium/vacuum_toroidal_field/r0:
    - {ref: input}
  equilibrium/vacuum_toroidal_field/b0:
    - {ref: input}
  core_profiles/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/ip:
    - {ref: input}
  equilibrium/time_slice/global_quantities/psi_boundary:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/r:
    - {ref: input}
  equilibrium/time_slice/boundary/outline/z:
    - {ref: input}
  core_sources/*:
    - {ref: input}
  core_sources/source(1)/identifier/name:
    - {value: ec}
  pf_active/coil(*)/current/data:
    - {ref: input}
  # machine_description's pf_active/* wildcard (input_md) has empty voltage.data per coil;
  # nice_imas.cc's ReadDataEvolutiveProblemWithRD indexes coil(i).voltage.data(0) with no
  # size check in its no-supply-data fallback branch -- segfaults on an empty array.
  pf_active/coil(*)/voltage/data:
    - {ref: input}